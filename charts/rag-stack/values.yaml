# 기준선(before): 각 구성 요소 문서의 기본 실행 예시대로 띄운다. 이미지와 모델은 미리 반입되어 있다.
# 완화 설정은 values-after.yaml, 일부러 누출을 넣은 설정은 values-leak.yaml에 있다.

# kind에서는 이미지를 kind load로 넣으므로 레지스트리에서 받지 않는다.
imagePullPolicy: Never

networkPolicy:
  enabled: true

components:
  llm:
    enabled: true
    image: ghcr.io/ggml-org/llama.cpp:server-b11347
    port: 8080
    healthPath: /health
    args: ["-m", "/models/kanana-1.5-2.1b-instruct-q4_k_m.gguf", "--host", "0.0.0.0", "--port", "8080",
           "-c", "2048", "-t", "2"]
    resources:
      requests: {cpu: "1", memory: 2Gi}
      limits: {cpu: "2", memory: 3Gi}
    volumeMounts:
      - {name: models, mountPath: /models, readOnly: true}
    volumes:
      - name: models
        hostPath: {path: /models, type: Directory}

  embed:
    enabled: true
    # arm64 노드(kind on Apple Silicon)용 태그. amd64 러너에서는 cpu-1.9.4를 쓴다.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-1.9.4
    port: 80
    healthPath: /health
    # 막힌 외부 요청마다 TEI가 멈추는 시간을 끝까지 기록하려고 기동 한도를 20분(5초 × 240)으로 넉넉히 둔다.
    startupFailureThreshold: 240
    # TEI 문서의 기본 예시: 허브 모델 ID + /data 캐시 볼륨
    args: ["--model-id", "intfloat/multilingual-e5-small",
           "--revision", "614241f622f53c4eeff9890bdc4f31cfecc418b3"]
    env:
      HUGGINGFACE_HUB_CACHE: /data
    resources:
      requests: {cpu: "500m", memory: 1Gi}
      limits: {cpu: "2", memory: 2Gi}
    volumeMounts:
      - {name: hf-cache, mountPath: /data}
    volumes:
      - name: hf-cache
        hostPath: {path: /models/hf-cache, type: Directory}

  qdrant:
    enabled: true
    image: qdrant/qdrant:v1.19.1
    port: 6333
    healthPath: /readyz
    resources:
      requests: {cpu: "250m", memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}

  rag:
    enabled: true
    image: airgap-rag-app:0.1.0
    port: 8000
    healthPath: /health
    env:
      LLM_URL: http://llm:8080
      EMBED_URL: http://embed:80
      QDRANT_URL: http://qdrant:6333
    resources:
      requests: {cpu: "100m", memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
