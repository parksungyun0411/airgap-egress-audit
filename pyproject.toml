[project]
name = "egressaudit"
version = "0.1.0"
description = "kind 클러스터에서 RAG 스택의 외부 호출 시도를 단계별로 기록하고 회귀 게이트로 막는다"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["matplotlib>=3.9"]

[project.scripts]
egress-audit = "egressaudit.cli:main"

# `uv sync`는 dev 그룹을 기본으로 설치한다. `uv run --extra dev`로도 같은 도구를 쓸 수 있게 extra도 둔다.
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/egressaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["app"]
